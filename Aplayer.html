<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
</head>
<body>
    <header>
        <h1></h1>
        <p></p>
    </header>
    
    <div id="aplayer"></div>
    
    <footer>
        <p></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    <script>
        // 音乐数据
        const musicData = [
            {
                title: "CYCLES",
                artist: "Masayoshi Minoshima,綾倉盟",
                url: "music/CYCLES.mp3",
                cover: "photos/CYCLES.jpeg",
                lrc: 'lrc/CYCLES.lrc'
            },
            {
                title: "トリカゴ",
                artist: "XX:me",
                url: "music/トリカゴ.mp3",
                cover: "photos/トリカゴ.jpeg",
                lrc: 'lrc/トリカゴ.lrc'
            },
            {
                title: "光るなら",
                artist: "Goose House",
                url: "music/光るなら.mp3",
                cover: "photos/光るなら.jpeg",
                lrc: 'lrc/光るなら.lrc'
            },
            {
                title: "The Right Path",
                artist: "Thomas Greenberg",
                url: "music/The Right Path.mp3",
                cover: "photos/The Right Path.jpeg",
                lrc: 'lrc/NO.lrc'
            },
            {
                title: "Trip",
                artist: "Axero",
                url: "music/Trip.mp3",
                cover: "photos/Trip.jpeg",
                lrc: 'lrc/NO.lrc'
            }
        ];
        
        // 初始化APlayer
        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            fixed: false,
            mini: false,
            autoplay: false,
            theme: '#b7daff',
            loop: 'all',
            order: 'list',
            preload: 'none',
            volume: 1,
            mutex: false,
            lrcType: 3,
            audio: musicData
        });

        // 添加错误处理
        ap.on('error', function(e) {
            console.error('播放器错误:', e);
        });
    </script>
</body>
</html>
